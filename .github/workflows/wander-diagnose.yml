name: Diagnose shared album feed (one-off)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install headless Chromium
        run: npx --yes playwright@1.47.2 install --with-deps chromium
      - name: Open the album page and log its API calls
        run: |
          cat > diag.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { readFile } from 'node:fs/promises';
          const { token } = JSON.parse(await readFile('data/wander.config.json', 'utf8'));
          const browser = await chromium.launch();
          const ctx = await browser.newContext();
          const page = await ctx.newPage();
          const reqs = [], resps = [];
          page.on('request', (r) => { const u = r.url(); if (/icloud|apple/i.test(u) && !/\.(js|css|png|svg|woff2?|ico|jpe?g)(\?|$)/i.test(u)) reqs.push({ m: r.method(), u, h: r.headers(), b: r.postData() || '' }); });
          page.on('response', async (res) => {
            const u = res.url();
            if (!/icloud|apple/i.test(u) || /\.(js|css|png|svg|woff2?|ico|jpe?g)(\?|$)/i.test(u)) return;
            let body = ''; try { body = (await res.text()).slice(0, 300000); } catch (_) {}
            resps.push({ u, status: res.status(), h: res.headers(), body });
          });
          await page.goto('https://photos.icloud.com/shared/album/' + token, { waitUntil: 'networkidle', timeout: 60000 }).catch((e) => console.log('goto:', e.message));
          await page.waitForTimeout(6000);
          const m = reqs.map((r) => r.u).join(' ').match(/publicAccessAuthToken=([^&\s]+)/);
          const tok = m ? decodeURIComponent(m[1]) : null;
          console.log('=== TOKEN (from URLs):', tok ? tok.slice(0, 24) + '... len ' + tok.length : 'NOT FOUND');
          const needle = tok ? tok.slice(0, 20) : null;
          const cookies = await ctx.cookies();
          console.log('=== COOKIES:', cookies.map((c) => c.name + '@' + c.domain + ' len ' + c.value.length).join(' | '));
          const storage = await page.evaluate(() => ({ local: Object.entries(localStorage).map(([k, v]) => [k, String(v).slice(0, 4000)]), session: Object.entries(sessionStorage).map(([k, v]) => [k, String(v).slice(0, 4000)]) }));
          console.log('=== STORAGE keys: local', storage.local.map((e) => e[0]).join(','), '| session', storage.session.map((e) => e[0]).join(','));
          if (needle) {
            for (const c of cookies) if (c.value.includes(needle)) console.log('>>> TOKEN IN COOKIE', c.name, c.domain);
            for (const [k, v] of [...storage.local, ...storage.session]) if (v.includes(needle)) { const i = v.indexOf(needle); console.log('>>> TOKEN IN STORAGE', k, '::', v.slice(Math.max(0, i - 200), i + 40)); }
            for (const r of resps) {
              const hv = JSON.stringify(r.h); if (hv.includes(needle)) console.log('>>> TOKEN IN RESPONSE HEADERS of', r.u.slice(0, 160), '::', hv.slice(Math.max(0, hv.indexOf(needle) - 200), hv.indexOf(needle) + 40));
              const i = r.body.indexOf(needle); if (i >= 0) console.log('>>> TOKEN IN RESPONSE BODY of', r.status, r.u.slice(0, 160), '::', r.body.slice(Math.max(0, i - 300), i + 40).replace(/\s+/g, ' '));
            }
            for (const r of reqs) { const i = r.b.indexOf(needle); if (i >= 0) console.log('>>> TOKEN IN REQUEST BODY of', r.u.slice(0, 160), '::', r.b.slice(Math.max(0, i - 200), i + 40)); }
          }
          console.log('=== RESPONSES (icloud/apple):');
          for (const r of resps) console.log(r.status, r.u.replace(/publicAccessAuthToken=[^&]+/, 'publicAccessAuthToken=<T>').slice(0, 170), '| body', r.body.length, '| keys:', (() => { try { const j = JSON.parse(r.body); return Object.keys(j).slice(0, 12).join(','); } catch (_) { return '-'; } })());
          const first = reqs.find((r) => r.u.includes('publicAccessAuthToken='));
          console.log('=== FIRST REQUEST WITH TOKEN:', first ? first.m + ' ' + first.u.replace(/publicAccessAuthToken=[^&]+/, 'publicAccessAuthToken=<T>').slice(0, 220) : '(none)');
          console.log('=== REQUEST ORDER (icloud/apple):'); for (const r of reqs.slice(0, 25)) console.log(r.m, r.u.replace(/publicAccessAuthToken=[^&]+/, 'publicAccessAuthToken=<T>').slice(0, 150), '| body', r.b.slice(0, 200));
          await browser.close();
          EOF
          npm i --no-save playwright@1.47.2
          node diag.mjs
